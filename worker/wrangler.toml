name = "sautium-verify"
main = "verify.js"
compatibility_date = "2024-01-01"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "bf74d396ca6c4b1cb46ff216ff2aa585"

# Birth ledger: one SQLite-backed Durable Object ("births") records every
# first issuance for adaptive difficulty (shadow until armed in verify.js).
[[durable_objects.bindings]]
name = "BIRTH_LEDGER"
class_name = "BirthLedger"

[exports.BirthLedger]
type = "durable-object"
storage = "sqlite"

# Master mailbox: one SQLite-backed Durable Object per recipient (only the
# shipped master has one) — offline store-and-forward for E2E chat, with a
# hibernating WebSocket the master holds for "mail" wake-ups.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MasterMailbox"

[exports.MasterMailbox]
type = "durable-object"
storage = "sqlite"

# Capability directory: reachable volunteer nodes list themselves so a
# DHT-less client's bootstrap does not funnel every role onto the master.
[[durable_objects.bindings]]
name = "NODE_DIRECTORY"
class_name = "NodeDirectory"

[exports.NodeDirectory]
type = "durable-object"
storage = "sqlite"

# Custom domain (optional): verify.sautium.net
# Configure in Cloudflare dashboard: Workers → Triggers → Custom Domains
