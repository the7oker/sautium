name = "sautium-verify"
main = "verify.js"
compatibility_date = "2024-01-01"

# KV namespace: the Worker's records (certificates, stamps, verified email,
# acceptances); its binding keeps the historic name. No limit counts here.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "bf74d396ca6c4b1cb46ff216ff2aa585"

# Birth ledger: one SQLite-backed Durable Object ("births") records every
# first issuance for adaptive difficulty (shadow until armed in verify.js).
[[durable_objects.bindings]]
name = "BIRTH_LEDGER"
class_name = "BirthLedger"

[exports.BirthLedger]
type = "durable-object"
storage = "sqlite"

# Master mailbox: one SQLite-backed Durable Object per recipient (only the
# shipped master has one) — offline store-and-forward for E2E chat, with a
# hibernating WebSocket the master holds for "mail" wake-ups.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MasterMailbox"

[exports.MasterMailbox]
type = "durable-object"
storage = "sqlite"

# Capability directory: reachable volunteer nodes list themselves so a
# DHT-less client's bootstrap does not funnel every role onto the master.
[[durable_objects.bindings]]
name = "NODE_DIRECTORY"
class_name = "NodeDirectory"

[exports.NodeDirectory]
type = "durable-object"
storage = "sqlite"

# Admission: one SQLite-backed Durable Object ("limits") holds every counter
# a write or a mail passes first (per key, per mailbox, per address, the
# route's daily ceiling), the username each key speaks under, and the pending
# email codes — atomic there, so a refused request writes nothing to KV.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[exports.Limiter]
type = "durable-object"
storage = "sqlite"

# Custom domain (optional): verify.sautium.net
# Configure in Cloudflare dashboard: Workers → Triggers → Custom Domains

# Per-address emergency brakes (Ф20): Rate Limiting bindings — no KV write, a
# 60 s window, counted per location — sized for a CGNAT cohort, never the
# accounting. The per-identity budget lives in the birth ledger (shadow).
[[ratelimits]]
name = "BRAKE_STAMP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "BRAKE_BIRTH"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# The per-minute brake of every other route, each in a bucket of its own
# (the route name is in the key), in front of the limiter object.
[[ratelimits]]
name = "BRAKE_ROUTE"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
