<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1B1714">
  <title>Sautium.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/tokens.css?v=3">
  <link rel="stylesheet" href="/static/style.css?v=54">
</head>
<body class="sautium-base">

  <main id="app" role="main"></main>

  <button id="aiFab" class="ai-fab" type="button" aria-label="Open AI assistant" hidden>AI</button>

  <div id="miniPlayer" class="mini-player" role="region" aria-label="Now playing" hidden>
    <div class="mp-cover" id="mpCover" aria-hidden="true"></div>
    <div class="mp-info">
      <div class="mp-title" id="mpTitle">—</div>
      <div class="mp-artist" id="mpArtist"></div>
    </div>
    <button class="mp-action" id="mpPlayPause" type="button" aria-label="Play or pause">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path id="mpPlayPauseIcon" d="M8 5v14l11-7z" fill="currentColor"/>
      </svg>
    </button>
    <button class="mp-action" id="mpNext" type="button" aria-label="Next track">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!--
    Now Playing sheet — modal full-screen overlay. Markup mirrors the
    canonical reference at docs/design/reference/claude-design-bundle/
    project/Now Playing v4.html. Keep the structure in lock-step with
    that file when refining.
  -->
  <div id="npSheet" class="np-sheet" role="dialog" aria-label="Now playing" hidden>
    <div class="np-screen">

      <div class="np-cover-block">
        <div class="np-cover-overlay">
          <div class="np-control-bar">
            <button class="np-icon-btn" id="npClose" type="button" aria-label="Collapse">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
            <div></div>
            <button class="np-icon-btn" id="npMenu" type="button" aria-label="More">
              <svg width="22" height="22" viewBox="0 0 24 24"
                   fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="5"  r="1.6"/>
                <circle cx="12" cy="12" r="1.6"/>
                <circle cx="12" cy="19" r="1.6"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="np-cover-wrap">
          <img id="npCoverImg" alt="" hidden>
          <div class="np-cover-fallback" id="npCoverFallback"></div>
          <div class="np-cover-scrim"></div>
          <button class="np-lyrics-btn" id="npLyricsBtn" type="button" aria-label="Show lyrics">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/>
              <path d="M6 10h8M6 14h12M16 10h2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="np-below">
        <h1 class="np-title" id="npTitleLine">—</h1>
        <div class="np-artist" id="npArtistLine"></div>
        <div class="np-album">
          <span id="npAlbumText"></span>
          <span class="np-year" id="npYearText"></span>
        </div>

        <div class="np-meta-row">
          <span class="np-q-badge" id="npQBadge"></span>
          <div class="np-key-pill" id="npKeyPill" hidden></div>
          <div class="np-bpm" id="npBpm" hidden>
            <span class="np-bpm-num" id="npBpmNum"></span>
            <span class="np-bpm-label">bpm</span>
          </div>
          <div class="np-energy" id="npEnergy" hidden>
            energy
            <span class="np-energy-dots" id="npEnergyDots"></span>
          </div>
        </div>

        <div class="np-progress-wrap">
          <div class="np-progress-track">
            <div class="np-progress-fill" id="npProgressFill"></div>
            <div class="np-progress-head" id="npProgressHead"></div>
          </div>
          <div class="np-progress-meta">
            <span id="npTimeCurrent">0:00</span>
            <span class="np-time-total" id="npTimeTotal">0:00</span>
          </div>
        </div>

        <div class="np-transport">
          <button class="np-tbtn-secondary" id="npQueueBtn"
                  type="button" aria-label="Queue">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true">
              <line x1="4" y1="7" x2="18" y2="7"/>
              <line x1="6" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="17" x2="16" y2="17"/>
            </svg>
          </button>
          <button class="np-tbtn" id="npPrev" type="button" aria-label="Previous">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
              <path d="M7 5v18H5V5h2zm16 1.2v15.6c0 1-1.1 1.6-1.9 1.1L9 15.1a1.3 1.3 0 010-2.2L21.1 5.1a1.3 1.3 0 011.9 1.1z"/>
            </svg>
          </button>
          <button class="np-play" id="npPlayPauseBtn" type="button" aria-label="Play or pause">
            <svg id="npPlayPauseSvg" width="28" height="28" viewBox="0 0 30 30"
                 fill="currentColor" aria-hidden="true">
              <path id="npPlayPauseIcon" d="M9 5v20l16-10z"/>
            </svg>
          </button>
          <button class="np-tbtn" id="npNextBtn" type="button" aria-label="Next">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
              <path d="M21 5v18h2V5h-2zM5 6.2v15.6c0 1 1.1 1.6 1.9 1.1L19 15.1a1.3 1.3 0 000-2.2L6.9 5.1A1.3 1.3 0 005 6.2z"/>
            </svg>
          </button>
          <button class="np-tbtn-secondary np-repeat" id="npRepeatBtn"
                  type="button" data-state="off" aria-label="Repeat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>
            </svg>
            <span class="np-repeat-badge">1</span>
          </button>
        </div>

        <div class="np-similar" id="npSimilar" hidden>
          <div class="np-similar-head">
            <h3 class="np-similar-title">Similar from your library</h3>
            <span class="np-similar-sub">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              CLAP · <span id="npSimilarCount">0</span> matches
            </span>
          </div>
          <div class="np-similar-list" id="npSimilarList"></div>
        </div>

        <div class="np-spacer"></div>
      </div>

    </div>
  </div>

  <!-- Queue sheet — full-screen overlay opened by the queue button
       in Now Playing's transport row. Reference: docs/design/reference/
       claude-design-bundle/project/Session 2 v3.html (Queue screen). -->
  <div id="queueSheet" class="queue-sheet" role="dialog"
       aria-label="Queue" hidden>
    <div class="queue-title-row">
      <button class="ai-icon-btn" type="button" id="queueCloseBtn"
              aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
      <h2 class="ai-title-center">Queue</h2>
      <span class="ai-icon-btn" aria-hidden="true"></span>
    </div>

    <div class="queue-summary" id="queueSummary"></div>
    <div class="queue-list" id="queueList"></div>
    <div class="queue-empty" id="queueEmpty" hidden>
      <p class="placeholder-body" style="padding: var(--space-6);">
        Queue is empty. Pick something to play.
      </p>
    </div>
  </div>

  <!-- AI assistant sheet — master-detail (chat view ↔ list view).
       Reference: tmp/Sautium-handoff (AI Chat - Master Detail.html).
       View A = thread + composer; view B = chats list with inline
       delete confirm. ← returns to list, × exits sheet. -->
  <div id="aiSheet" class="ai-sheet" role="dialog" aria-label="AI assistant" hidden>

    <!-- View A — chat (default on open, shows the most recent chat). -->
    <div class="ai-view ai-view-chat" id="aiViewChat">
      <div class="ai-title-row">
        <button class="ai-icon-btn" type="button" id="aiBackBtn"
                aria-label="Back to chats">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
        <h2 class="ai-title-center" id="aiChatTitle">AI</h2>
        <button class="ai-icon-btn" type="button" id="aiCloseBtnChat"
                aria-label="Close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>

      <div class="ai-thread" id="aiThread" role="log" aria-live="polite"></div>

      <form class="ai-input-row" id="aiInputForm">
        <input type="text" class="ai-input" id="aiInput"
               placeholder="Ask me…" autocomplete="off" autocapitalize="off">
        <button class="ai-send-btn" type="submit" id="aiSendBtn"
                aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </form>
    </div>

    <!-- View B — chats list (full-screen, replaces thread + composer). -->
    <div class="ai-view ai-view-list" id="aiViewList" hidden>
      <div class="ai-title-row ai-title-row-cta">
        <button class="ai-icon-btn" type="button" id="aiCloseBtnList"
                aria-label="Close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
        <h2 class="ai-title-center">Chats</h2>
        <button class="ai-new-chat-btn" type="button" id="aiNewBtn">
          <span class="ai-plus">+</span>New
        </button>
      </div>

      <div class="ai-chat-list" id="aiChatList"></div>
      <div class="ai-empty-wrap" id="aiEmpty" hidden>
        <div class="ai-empty-glyph">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21 12a8 8 0 01-11.7 7.1L4 21l1.9-5.3A8 8 0 1121 12z"/>
          </svg>
        </div>
        <p class="ai-empty-prose">No chats yet — start a new conversation.</p>
        <button class="ai-cta-new" type="button" id="aiEmptyNewBtn">
          <span class="ai-plus">+</span>New chat
        </button>
      </div>
    </div>

  </div>

  <nav id="bottomNav" class="bottom-nav" role="navigation" aria-label="Primary">
    <button class="nav-tab" type="button" data-route="home" aria-label="Home">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H10v7H4a1 1 0 0 1-1-1V11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-tab" type="button" data-route="discovery" aria-label="Discovery">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Discovery</span>
    </button>
    <button class="nav-tab" type="button" data-route="friends" aria-label="Friends">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M3 20c0-3 2.5-5 6-5s6 2 6 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M14 17c0-2 1.7-3.5 4-3.5s4 1.5 4 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Friends</span>
    </button>
    <button class="nav-tab" type="button" data-route="more" aria-label="More">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="6" r="1.6" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
        <circle cx="12" cy="18" r="1.6" fill="currentColor"/>
      </svg>
      <span class="nav-label">More</span>
    </button>
  </nav>

  <!--
    Compatibility stubs — invisible elements with the IDs that the legacy
    app.js expects to write to (npSong, progressFill, searchInput, etc).
    They let app.js continue polling status / fetching playlist / etc
    without throwing null-ref errors while individual screens are still
    being migrated to the new shell. As each screen is rewritten, its
    stubs migrate out of this block into the live screen markup.
  -->
  <div id="legacy-stubs" hidden aria-hidden="true">
    <div id="connDot"></div>
    <div id="sectionTitle"></div>
    <div id="slideMenu"></div>
    <div id="menuOverlay"></div>
    <button id="hamburgerBtn" type="button"></button>
    <span id="friendsBadge"></span>

    <!-- Now Playing legacy widget -->
    <div id="npSong"></div>
    <div id="npArtist"></div>
    <div id="progressFill"></div>
    <div id="progressTime"></div>
    <button id="playPauseBtn" type="button"></button>
    <span id="volLabel"></span>

    <!-- Lyrics -->
    <div id="lyricsPanel" style="display:none"></div>
    <div id="lyricsContent"></div>
    <button id="lyricsToggleBtn" type="button"></button>

    <!-- Search tab -->
    <input id="searchInput" type="text">
    <div id="searchResults"></div>

    <!-- Discover tab -->
    <input id="discoverInput" type="text">
    <button id="discoverSearchBtn" type="button"></button>
    <button id="radioBtn" type="button"></button>
    <div id="discoverNowPlaying"></div>
    <div id="discoverSimilar"></div>
    <div id="discoverResults"></div>
    <input id="bpmMin" type="number">
    <input id="bpmMax" type="number">
    <select id="featureKey"></select>

    <!-- AI DJ tab -->
    <div id="chatMessages"></div>
    <input id="chatInput" type="text">
    <button id="chatSendBtn" type="submit"></button>
    <div id="sessionList"></div>
    <div id="providerSelector"></div>

    <!-- Queue tab -->
    <div id="queueContent"></div>

    <!-- Friends section -->
    <div id="myInviteCode"></div>
    <input id="addFriendInput" type="text">
    <input id="inviteEmailInput" type="email">
    <button id="inviteEmailBtn" type="submit"></button>
    <div id="inviteEmailStatus"></div>
    <div id="friendList"></div>
    <div id="chatFriendName"></div>
    <div id="p2pMessages"></div>
    <input id="p2pChatInput" type="text">
    <form id="p2pChatForm"></form>

    <!-- Settings: Account -->
    <div id="settingsUsername"></div>
    <div id="settingsInviteCode"></div>
    <span id="settingsEmailBadge"></span>
    <div id="settingsEmail"></div>
    <div id="settingsEmailGroup" style="display:none"></div>
    <div id="emailVerifySection" style="display:none"></div>
    <div id="emailCodeSection" style="display:none"></div>
    <button id="sendVerifyBtn" type="button"></button>
    <input id="emailVerifyCodeInput" type="text">
    <button id="verifyCodeBtn" type="submit"></button>
    <div id="emailVerifyStatus"></div>

    <!-- Settings: HQPlayer -->
    <div id="settingsHqpStatus"></div>
    <div id="settingsHqpHost"></div>
    <div id="settingsHqpPort"></div>

    <!-- Settings: Last.fm -->
    <div id="settingsLastfmUser"></div>
    <span id="settingsLastfmBadge"></span>
    <button id="lastfmAuthBtn" type="button"></button>
    <a id="lastfmAuthLink" href="#"></a>
    <div id="lastfmAuthUrl" style="display:none"></div>
    <div id="lastfmAuthStatus"></div>
  </div>

  <script src="/static/auth.js?v=1"></script>
  <script src="/static/app-shell.js?v=84"></script>
  <script src="/static/app.js?v=16"></script>
</body>
</html>
