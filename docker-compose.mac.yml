# Docker Compose for macOS (Apple Silicon — M1/M2/M3/M4/M5)
# Usage: docker compose -f docker-compose.mac.yml up --build
#
# Differences from main docker-compose.yml:
#   - No NVIDIA GPU / CUDA (uses CPU-only PyTorch)
#   - Dockerfile.mac instead of Dockerfile
#   - No CUDA_VISIBLE_DEVICES env var
#   - Mac-friendly path defaults

services:
  postgres:
    # Official pgvector image (ankane/pgvector is abandoned at 0.5.1). Same
    # pg18 series as the main compose so a datadir initialized on either
    # machine stays interchangeable.
    image: pgvector/pgvector:pg18
    container_name: sautium-postgres
    # Docker's default /dev/shm is 64MB — parallel hash joins / pgvector ops
    # allocate dynamic shared memory there and die with "could not resize
    # shared memory segment: No space left on device" on an 18GB database.
    shm_size: 1gb
    # Tiered PG memory settings — see docker-compose.yml for rationale.
    command: postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      -c work_mem=${PG_WORK_MEM:-16MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
      POSTGRES_USER: ${POSTGRES_USER:-musicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      # PG18 images store data in a major-versioned subdir and require the mount
      # at /var/lib/postgresql (NOT /data) — mounting the old /data path makes the
      # entrypoint refuse to start. See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
      - ./desktop/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sautium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicai} -d ${POSTGRES_DB:-music_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.mac
    container_name: sautium-backend
    environment:
      # Database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
      POSTGRES_USER: ${POSTGRES_USER:-musicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Music library path (inside container)
      MUSIC_LIBRARY_PATH: /music

      # API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      LASTFM_SESSION_KEY: ${LASTFM_SESSION_KEY:-}

      # No GPU — CPU-only inference on Mac
      # CUDA_VISIBLE_DEVICES is not set

      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # HQPlayer integration
      HQPLAYER_HOST: ${HQPLAYER_HOST:-host.docker.internal}
      HQPLAYER_PORT: ${HQPLAYER_PORT:-4321}
      HQPLAYER_ENABLED: ${HQPLAYER_ENABLED:-false}

      # Native OS path prefix for DB-stored paths
      MUSIC_HOST_PATH: ${MUSIC_HOST_PATH:-}

      # Claude Code integration
      CLAUDE_CODE_ENABLED: ${CLAUDE_CODE_ENABLED:-true}

      # P2P / DHT
      P2P_ENABLED: ${P2P_ENABLED:-true}
      P2P_DHT_PORT: ${P2P_DHT_PORT:-19001}
      P2P_ANNOUNCE_PORT: ${P2P_ANNOUNCE_PORT:-8800}
      P2P_USERNAME: ${P2P_USERNAME:-}
      P2P_PASSWORD: ${P2P_PASSWORD:-}
      P2P_EMAIL: ${P2P_EMAIL:-}

      # Multi-provider LLM support
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      OPENAI_COMPAT_NAME: ${OPENAI_COMPAT_NAME:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-claude_code}
      MB_DUMP_DIR: /app/data/mbdump        # writable mount for the MusicBrainz dump
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./mcp:/app/mcp
      - ./data/cache:/root/.cache
      - ./data/generated_eq:/app/generated_eq
      - ./data/mbdump:/app/data/mbdump   # MusicBrainz dump (download + stream-load)
      - ./data/support:/app/data/support # support desk — bundles user nodes sent, unpacked on demand (master only)
      # Mount music library as read-only
      # Mac path example: /Users/username/Music -> /music in container
      - ${MUSIC_LIBRARY_PATH:-/Users/Shared/Music}:/music:ro
      # Claude Code auth (OAuth tokens). USERPROFILE on Windows shells,
      # HOME everywhere else — see the matching note in docker-compose.yml.
      # Mount the WHOLE .claude directory (not just .credentials.json) so
      # the container survives the CLI's atomic-rename refresh cycle —
      # see docker-compose.yml for the long-form rationale.
      - ${USERPROFILE:-${HOME}}/.claude:/home/agent/.claude
      - ./data/claude_sessions:/home/agent/.claude/projects
    ports:
      # Backend on 0.0.0.0 by design — LAN access (phone, tablet) is the
      # primary workflow. Internet exposure is blocked at the UPnP layer
      # (p2p_manager.py never maps this port). See CLAUDE.md
      # "Security Posture" before changing this.
      - "8800:8000"
      # P2P DHT MUST stay on 0.0.0.0 — that's the public peer surface.
      - "${P2P_DHT_PORT:-19001}:${P2P_DHT_PORT:-19001}/udp"
    networks:
      - sautium-network
    depends_on:
      postgres:
        condition: service_healthy
    # No GPU reservation — Apple Silicon GPU (MPS) is not available inside Docker
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  sautium-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
