services:
  postgres:
    image: ankane/pgvector:latest
    container_name: sautium-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
      POSTGRES_USER: ${POSTGRES_USER:-musicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./desktop/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sautium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicai} -d ${POSTGRES_DB:-music_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Loopback-only: postgres is never accessed from outside the host.
    # Inter-container traffic uses the docker network, not this port.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sautium-backend
    environment:
      # Database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
      POSTGRES_USER: ${POSTGRES_USER:-musicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Music library path (inside container)
      MUSIC_LIBRARY_PATH: /music

      # API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      LASTFM_SESSION_KEY: ${LASTFM_SESSION_KEY:-}

      # GPU configuration
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}

      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # HQPlayer integration
      HQPLAYER_HOST: ${HQPLAYER_HOST:-host.docker.internal}
      HQPLAYER_PORT: ${HQPLAYER_PORT:-4321}
      HQPLAYER_ENABLED: ${HQPLAYER_ENABLED:-false}

      # Native OS path prefix for DB-stored paths (scanner translates /music/... → this)
      # Set in .env, e.g.: MUSIC_HOST_PATH=E:/Music
      MUSIC_HOST_PATH: ${MUSIC_HOST_PATH:-}
      TRACKER_URL: http://playback-tracker:8765

      # Claude Code integration
      CLAUDE_CODE_ENABLED: ${CLAUDE_CODE_ENABLED:-true}

      # P2P / DHT
      P2P_ENABLED: ${P2P_ENABLED:-true}
      P2P_DHT_PORT: ${P2P_DHT_PORT:-19001}
      P2P_ANNOUNCE_PORT: ${P2P_ANNOUNCE_PORT:-8800}
      P2P_USERNAME: ${P2P_USERNAME:-}
      P2P_PASSWORD: ${P2P_PASSWORD:-}
      P2P_EMAIL: ${P2P_EMAIL:-}

      # Multi-provider LLM support
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      OPENAI_COMPAT_NAME: ${OPENAI_COMPAT_NAME:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-claude_code}

      # TLS — backend serves HTTPS only. Browsers block crypto.subtle (used
      # for HMAC request signing) outside secure contexts, so HTTP from a
      # phone over LAN does not work; HTTPS does.
      # SAUTIUM_HOST_IPS lists extra private IPs to add to the cert SAN
      # (the host's LAN address — Docker can't auto-detect this from inside
      # the container). Set in .env, e.g.: SAUTIUM_HOST_IPS=192.168.1.188
      SAUTIUM_HOST_IPS: ${SAUTIUM_HOST_IPS:-}
      # Intra-container backend self-calls (Claude Code tools, MCP server).
      BACKEND_URL: https://localhost:8000
      MB_DUMP_DIR: /app/data/mbdump        # writable mount for the MusicBrainz dump
      # Disable uvicorn auto-reload in Docker. The bind-mounted ./backend
      # lives on WSL2 drvfs (or macOS osxfs); inotify periodically returns
      # EIO (errno 5) on those filesystems, which crashes the Rust-based
      # watchfiles watcher and takes the whole uvicorn process down. Manual
      # `docker restart sautium-backend` is the documented workflow anyway.
      UVICORN_RELOAD: "false"
    extra_hosts:
      # Allow container to access Windows host services (like HQPlayer)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./mcp:/app/mcp
      - ./data/cache:/root/.cache
      - ./data/generated_eq:/app/generated_eq
      # Self-signed TLS cert (generated on first start by entrypoint.py).
      # Persists across rebuilds so the phone doesn't need to re-accept it.
      - ./data/tls:/app/data/tls
      - ./data/mbdump:/app/data/mbdump   # MusicBrainz dump (download + stream-load)
      # Mount music library as read-only
      # Windows path: E:\Music -> /music in container
      - ${MUSIC_LIBRARY_PATH:-/mnt/e/Music}:/music:ro
      # Claude Code auth (OAuth tokens) from the Windows-side ~/.claude/.
      # USERPROFILE is set by Windows shells (cmd / PowerShell), HOME by
      # Unix shells. The bare ${HOME} form silently degraded on Win
      # PowerShell to /.claude/... and Docker quietly mounted an empty
      # directory in place of the missing file, so Claude Code started
      # without credentials and returned "Claude Code error".
      # If your active Claude Code lives in WSL (refresh tokens written to
      # /home/<user>/.claude/) the Windows file is stale — use the
      # docker-compose.wsl.yml variant from a WSL bash shell instead.
      #
      # Mount the WHOLE .claude directory, not just .credentials.json.
      # The CLI rewrites credentials via atomic rename (write tmp → rename
      # to .credentials.json), which changes the file's inode. A bind mount
      # of a single file pins the original inode, so after every refresh
      # the container reads a stale token until restart. Mounting the
      # directory binds the dir inode (which doesn't change on rename),
      # so the container sees the freshly-renamed file immediately.
      - ${USERPROFILE:-${HOME}}/.claude:/home/claudeuser/.claude
      # Claude Code session storage — persisted on the host so chat history
      # survives container rebuilds. Without this, every `up --build`
      # invalidates every saved session_id and chat retries fail with
      # "No conversation found". Stacked on top of the .claude dir mount
      # above so sessions live on the project's own volume, not in the
      # user's home (where they'd mix with the host CLI's sessions).
      - ./data/claude_sessions:/home/claudeuser/.claude/projects
    ports:
      # Backend on 0.0.0.0 by design — LAN access (phone, tablet) is the
      # primary workflow. Internet exposure is blocked at the UPnP layer
      # (p2p_manager.py never maps this port). See CLAUDE.md
      # "Security Posture" before changing this.
      - "8800:8000"
      # P2P DHT MUST stay on 0.0.0.0 — that's the public peer surface.
      - "${P2P_DHT_PORT:-19001}:${P2P_DHT_PORT:-19001}/udp"
    networks:
      - sautium-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    command: python entrypoint.py

  playback-tracker:
    build:
      context: ./backend
      dockerfile: Dockerfile.tracker
    container_name: sautium-playback-tracker
    environment:
      # HQPlayer connection
      HQPLAYER_HOST: ${HQPLAYER_HOST:-host.docker.internal}
      HQPLAYER_PORT: ${HQPLAYER_PORT:-4321}

      # Database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
      POSTGRES_USER: ${POSTGRES_USER:-musicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Last.fm Scrobbling
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET}
      LASTFM_USERNAME: ${LASTFM_USERNAME}
      LASTFM_SESSION_KEY: ${LASTFM_SESSION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8765:8765"  # HTTP API for playlist registration (loopback only)
    networks:
      - sautium-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python playback_tracker.py --hqplayer-host ${HQPLAYER_HOST:-host.docker.internal} --db-host postgres

networks:
  sautium-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
